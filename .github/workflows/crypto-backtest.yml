name: Crypto Tune Backtest

on:
  push:
    branches:
      - chatgpt-crypto-backtest-20260822
    paths-ignore:
      - 'tuning_output/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate

      - name: Run 10-year crypto tuning grid
        run: python backtests/crypto_tune_10y.py

      - name: Upload tuning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-tuning-results
          path: tuning_output/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit tuning results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuning_output
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Store crypto tuning results [skip ci]"
            git push origin HEAD:chatgpt-crypto-backtest-20260822
          fi
