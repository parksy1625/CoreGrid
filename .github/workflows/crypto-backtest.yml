name: Crypto Universal Backtest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated backtest branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate

      - name: Run 10-year crypto backtest
        run: python backtests/crypto_universal_10y.py

      - name: Commit results to isolated branch
        if: always()
        run: |
          if [ -d backtest_output ] && [ "$(find backtest_output -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backtest_output
            git commit -m "Store crypto backtest results" || true
            git push origin HEAD:chatgpt-crypto-backtest-20260822
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-results
          path: backtest_output/
          if-no-files-found: warn
          retention-days: 7
