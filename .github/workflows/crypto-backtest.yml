name: Crypto Universal Backtest

on:
  push:
    branches:
      - chatgpt-crypto-backtest-20260822
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate

      - name: Run 10-year crypto backtest
        run: python backtests/crypto_universal_10y.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-results
          path: backtest_output/
          if-no-files-found: warn
          retention-days: 7
