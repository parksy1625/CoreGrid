name: Crypto Tuning Grid

# Triggered after tuner script was added to the isolated branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate

      - name: Run 10-year parameter and leverage tuning
        run: python backtests/crypto_tune_10y.py

      - name: Commit tuning results to tuning branch
        if: always()
        run: |
          if [ -d tuning_output ] && [ "$(find tuning_output -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tuning_output
            git commit -m "Store crypto tuning results [skip ci]" || true
            git push origin HEAD:chatgpt-crypto-backtest-20260822
          fi

      - name: Upload tuning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-tuning-results
          path: tuning_output/
          if-no-files-found: warn
          retention-days: 7
