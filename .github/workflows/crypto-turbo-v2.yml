name: Crypto Turbo V2 Rotation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  turbo-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate
      - name: Run Turbo v2
        run: python backtests/crypto_turbo_v2_rotation.py
      - name: Commit results
        if: always()
        run: |
          if [ -d turbo_v2_output ] && [ "$(find turbo_v2_output -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add turbo_v2_output
            git commit -m "Store Turbo v2 rotation results [skip ci]" || true
            git push origin HEAD:chatgpt-crypto-backtest-20260822
          fi
