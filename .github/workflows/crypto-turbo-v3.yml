name: Crypto Turbo v3 Acceleration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  turbo-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate
      - name: Run Turbo v3 fast screen
        run: python backtests/crypto_turbo_v3_fast.py
      - name: Commit results
        if: always()
        run: |
          if [ -d turbo_v3_fast_output ] && [ "$(find turbo_v3_fast_output -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add turbo_v3_fast_output
            git commit -m "Store Turbo v3 fast results [skip ci]" || true
            git push origin HEAD:chatgpt-crypto-backtest-20260822
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-turbo-v3-fast-results
          path: turbo_v3_fast_output/
          if-no-files-found: warn
          retention-days: 7
