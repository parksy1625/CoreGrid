name: Crypto Turbo v4 Breadth

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  turbo-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate
      - name: Run Turbo v4
        run: python backtests/crypto_turbo_v4_breadth.py
      - name: Commit results
        if: always()
        run: |
          if [ -d turbo_v4_output ] && [ "$(find turbo_v4_output -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add turbo_v4_output
            git commit -m "Store Turbo v4 results [skip ci]" || true
            git push origin HEAD:chatgpt-crypto-backtest-20260822
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-turbo-v4-results
          path: turbo_v4_output/
          if-no-files-found: warn
          retention-days: 7
