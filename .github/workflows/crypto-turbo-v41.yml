name: Crypto Turbo v4.1 Hybrid

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  turbo-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate
      - name: Run Turbo v4.1
        run: python backtests/crypto_turbo_v41_hybrid.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-turbo-v41-results
          path: turbo_v41_output/
          if-no-files-found: warn
          retention-days: 7
