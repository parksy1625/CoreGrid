name: Crypto Turbo v4.9 SuperBull 3000x

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'TURBO_V49_TRIGGER.txt'
      - '.github/workflows/crypto-turbo-v49.yml'
      - 'backtests/crypto_turbo_v49_superbull.py'

jobs:
  turbo-v49:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Fetch v4.9 script
        run: curl -L --fail https://raw.githubusercontent.com/parksy1625/CoreGrid/turbo-v3-run-20260822/backtests/crypto_turbo_v49_superbull.py -o backtests/crypto_turbo_v49_superbull.py
      - name: Run Turbo v4.9
        working-directory: backtests
        run: python crypto_turbo_v49_superbull.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: crypto-turbo-v49-results
          path: backtests/turbo_v49_output/
