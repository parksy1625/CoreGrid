name: Crypto Turbo v5.3 Median 250

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backtests/crypto_turbo_v53_median250.py'
      - '.github/workflows/crypto-turbo-v53.yml'
      - 'TURBO_V53_TRIGGER.txt'
  workflow_dispatch:

jobs:
  turbo-v53:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas requests
      - name: Fetch v5.2 base
        run: curl -L --fail https://raw.githubusercontent.com/parksy1625/CoreGrid/turbo-v3-run-20260822/backtests/crypto_turbo_v52_dualsleeve.py -o backtests/crypto_turbo_v52_dualsleeve.py
      - name: Fetch v5.3 script
        run: curl -L --fail https://raw.githubusercontent.com/parksy1625/CoreGrid/turbo-v3-run-20260822/backtests/crypto_turbo_v53_median250.py -o backtests/crypto_turbo_v53_median250.py
      - name: Run Turbo v5.3
        working-directory: backtests
        run: python crypto_turbo_v53_median250.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: crypto-turbo-v53-results
          path: backtests/turbo_v53_output/
