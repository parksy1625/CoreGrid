name: Crypto Turbo v5.8 Risk-Constrained 1000
on:
  pull_request:
    paths:
      - 'backtests/crypto_turbo_v58_median1000.py'
      - '.github/workflows/crypto-turbo-v58.yml'
      - 'TURBO_V58_TRIGGER.txt'
  workflow_dispatch:
jobs:
  turbo-v58:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Fetch base engine
        run: curl -L --fail https://raw.githubusercontent.com/parksy1625/CoreGrid/turbo-v3-run-20260822/backtests/crypto_turbo_v52_dualsleeve.py -o backtests/crypto_turbo_v52_dualsleeve.py
      - name: Fetch V5.8
        run: curl -L --fail https://raw.githubusercontent.com/parksy1625/CoreGrid/turbo-v3-run-20260822/backtests/crypto_turbo_v58_median1000.py -o backtests/crypto_turbo_v58_median1000.py
      - name: Run V5.8
        working-directory: backtests
        run: python crypto_turbo_v58_median1000.py
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-turbo-v58-results
          path: backtests/turbo_v58_output/
