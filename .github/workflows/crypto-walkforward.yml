name: Crypto MDD Walkforward Tuning

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-crypto-backtest-20260822
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate

      - name: Run MDD-focused walk-forward tuning
        run: python backtests/crypto_mdd_tune_10y.py

      - name: Commit results to tuning branch
        if: always()
        run: |
          if [ -d mdd_tuning_output ] && [ "$(find mdd_tuning_output -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mdd_tuning_output
            git commit -m "Store MDD tuning results [skip ci]" || true
            git push origin HEAD:chatgpt-crypto-backtest-20260822
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mdd-tuning-results
          path: mdd_tuning_output/
          if-no-files-found: warn
          retention-days: 7
