name: Build ZIP Gallery APK
on:
  push:
    paths:
      - 'zip-media-viewer/**'
      - '.github/workflows/zip-media-viewer-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zip-media-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: ZIP archive stress smoke test
        run: python3 tools/stress_zip.py --entries 30000
      - name: Install ZIP Gallery launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app-icon.webp.base64 > app/src/main/res/drawable-nodpi/zip_gallery_icon.webp
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIPGallery-v1.0-debug-apk
          path: zip-media-viewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ZIPGallery-v1.0-debug.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zip-gallery-v1.0
          name: ZIP Gallery v1.0
          body: |
            ZIP Gallery v1.0 Android debug APK (testing build).
            Download ZIPGallery-v1.0-debug.apk directly below.
          files: zip-media-viewer/app/build/outputs/apk/debug/ZIPGallery-v1.0-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
