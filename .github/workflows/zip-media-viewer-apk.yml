name: Build ZIP Media Viewer APK
on:
  push:
    paths:
      - 'zip-media-viewer/**'
      - '.github/workflows/zip-media-viewer-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zip-media-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK environment
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -la "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" || true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIPMediaViewer-debug-apk
          path: zip-media-viewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
